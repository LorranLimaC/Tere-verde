<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Criar Evento</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin_eventos.css">

</head>
<header class="menu">
   <div class = "logotipo">
        <a href="index.html">
            <img src="png/Logotipo-TereVerde.png" alt="Tere Verde Logotipo">
        </a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">inicio</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>
</header>
<body>

    <div class="container-admin">
        <h2 style="text-align: center; color: #2d5016;">📅 Cadastrar Novo Evento</h2>
        <p style="text-align: center; font-size: 14px;">Preencha os dados abaixo para publicar no site.</p>
        <hr>

        <form id="formEvento">
            <div class="form-grupo">
                <label for="nome">Nome do Evento*</label>
                <input type="text" id="nome" placeholder="Ex: Mutirão de Limpeza PARNASO" required>
            </div>

            <div class="form-grupo" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="data">Data*</label>
                    <input type="date" id="data" required>
                </div>
                <div style="flex: 1;">
                    <label for="horario">Horário*</label>
                    <input type="time" id="horario" required>
                </div>
            </div>

            <div class="form-grupo">
                <label for="local">Local*</label>
                <input type="text" id="local" placeholder="Ex: Sede Teresópolis" required>
            </div>

            <div class="form-grupo">
                <label for="descricao">Descrição Breve</label>
                <textarea id="descricao" rows="4" placeholder="Detalhes sobre o evento..."></textarea>
            </div>

            <button type="submit" class="btn-salvar">Salvar Evento</button>
            <a href="dashboard.html" style="display:block; text-align:center; margin-top:15px; color:#666; text-decoration:none;">Voltar ao Painel</a>
        </form>
    </div>

    <script>
        document.getElementById('formEvento').addEventListener('submit', function(e) {
            e.preventDefault(); // Não deixa a página recarregar

            // Pegando os valores
            const nome = document.getElementById('nome').value;
            const data = document.getElementById('data').value;
            const local = document.getElementById('local').value;

            // Validação simples (o 'required' do HTML já ajuda, mas aqui reforçamos)
            if(nome && data && local) {
                alert("✅ Sucesso! O evento '" + nome + "' foi cadastrado e ficará visível em breve.");
                this.reset(); // Limpa o formulário
            } else {
                alert("❌ Erro: Por favor, preencha todos os campos obrigatórios (*).");
            }
        });
    </script>
</body>
</html>
